name: Deploy homepage to GitHub Pages

# The site is plain static files at the repository root — no build step — so
# the workflow only packages the checkout and hands it to Pages.

on:
  push:
    branches: [claude/inexa-premium-homepage-is2zrg]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published, but
# only ever queue one behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Configure Pages
        # enablement turns Pages on via the API if it is not already enabled,
        # so the site goes live without anyone touching repository settings.
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Stamp asset versions
        # HTML and CSS are cached independently for ten minutes, so a visitor
        # can be served new markup alongside the PREVIOUS stylesheet — which
        # renders any new section completely unstyled until the CSS expires.
        # Stamping the commit onto every asset URL makes each deploy's HTML
        # request its own assets, so the two can never be out of step.
        run: |
          find . -name '*.html' -not -path './.git/*' -print0 \
            | xargs -0 --no-run-if-empty sed -i "s/?v=dev/?v=${GITHUB_SHA:0:8}/g"
          echo "Stamped ?v=${GITHUB_SHA:0:8}"
          grep -o 'site\.css?v=[a-z0-9]*' index.html | head -1

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
